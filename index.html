  <title>PujaPath | পুজোর কলকাতা, আপনার পথে — Durga Puja & Metro Discovery</title>
  <!-- Early Theme Initialization to Prevent Flash of Unstyled Content (FOUC) -->
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('pujapath_theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#FAF7F2');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <!-- Google Fonts: Plus Jakarta Sans & Hind Siliguri -->
